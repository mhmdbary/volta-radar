name: Volta Radar

on:
  schedule:
    - cron: "*/5 * * * *"  # GitHub runs this every 5 minutes at best, sometimes later
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check accounts and send alerts
        env:
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: python notifier.py --once

      - name: Save state
        run: |
          git config user.name "volta-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json handles.txt
          git diff --cached --quiet || (git commit -m "Update radar state" && git pull --rebase && git push)
