name: Volta Radar

# GitHub's cron is unreliable (often hours late), so each run keeps checking for
# ~5.5 hours and then starts the next run itself. The hourly cron is only a backup.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check accounts and send alerts (loop)
        env:
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          git config user.name "volta-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$((SECONDS + 330 * 60))
          while [ $SECONDS -lt $end ]; do
            git pull -q --rebase || true   # pick up handles/settings changed from outside
            python notifier.py --once || echo "check failed, retrying next round"
            git add state.json handles.txt tags.json
            git diff --cached --quiet || (git commit -q -m "Update radar state" && (git push -q || (git pull -q --rebase && git push -q)))
            sleep 180
          done

      - name: Start the next run
        if: success() || failure()  # not when cancelled by hand, so you can stop it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run radar.yml --repo ${{ github.repository }}
