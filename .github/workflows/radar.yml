name: Volta Radar

# GitHub's cron is unreliable (often hours late), so each run keeps checking for
# ~5.5 hours and then starts the next run itself. The hourly cron is only a backup.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet anthropic

      - name: Run the bot (instant commands + checks every check_seconds)
        env:
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          git config user.name "volta-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # one process for ~5.5h; it commits its own state every 2 minutes
          timeout 340m python notifier.py --daemon 330 || echo "bot stopped early"

      - name: Start the next run
        if: success() || failure()  # not when cancelled by hand, so you can stop it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run radar.yml --repo ${{ github.repository }}
